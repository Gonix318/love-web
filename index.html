
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9ddff">
    <title>A Little Question 💜</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --lavender: #a98be8;
            --pink: #f1a9d0;
            --text: #665078;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 20px;
            overflow-x: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(
                135deg, #e9ddff, #ffe5f1, #f4eaff
            );
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 36px 23px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.85);
            border-radius: 30px;
            background: rgba(255,255,255,.72);
            box-shadow: 0 20px 60px rgba(116,83,158,.17);
            backdrop-filter: blur(12px);
            animation: appear .9s ease both;
        }

        .heart {
            font-size: 60px;
            color: #d78cc9;
            animation: heartbeat 1.8s infinite;
        }

        .subtitle {
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 2.5px;
            color: #9879b6;
        }

        h1 {
            margin: 20px 0 14px;
            font-size: clamp(27px, 7vw, 36px);
            line-height: 1.35;
            color: #8665b3;
        }

        .description {
            font-size: 15px;
            line-height: 1.8;
            color: #927e9e;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 13px;
            min-height: 70px;
            margin-top: 28px;
        }

        .choice {
            border: 0;
            border-radius: 50px;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            transition:
                transform .35s ease,
                background .3s ease,
                box-shadow .3s ease;
        }

        #yesBtn {
            position: relative;
            z-index: 2;
            color: white;
            background: linear-gradient(135deg, #aa8be8, #eea2ce);
            box-shadow: 0 7px 20px rgba(178,130,210,.3);
        }

        #yesBtn:hover {
            box-shadow: 0 10px 28px rgba(178,130,210,.48);
        }

        #noBtn {
            color: #8c75a0;
            background: rgba(255,255,255,.9);
            border: 1px solid #e6d8ef;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #b09bbd;
        }

        .music-btn {
            position: fixed;
            z-index: 20;
            top: 15px;
            right: 15px;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 30px;
            color: #80669a;
            background: rgba(255,255,255,.8);
            cursor: pointer;
        }

        .float-heart {
            position: fixed;
            z-index: 1;
            bottom: -30px;
            pointer-events: none;
            opacity: 0;
            animation: floatUp linear forwards;
        }

        .ending {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
            text-align: center;
            color: white;
            background:
                radial-gradient(ellipse at 50% 45%,
                    rgba(218,166,255,.65), transparent 45%),
                linear-gradient(145deg, #211735, #55345f, #251d42);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.3s ease, visibility 1.3s;
        }

        .ending.show {
            opacity: 1;
            visibility: visible;
        }

        .ending-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            animation: appear 1.5s ease both;
        }

        .ending-heart {
            font-size: clamp(65px, 18vw, 100px);
            filter: drop-shadow(0 0 25px #ffa9e3);
            animation: heartbeat 1.5s infinite;
        }

        .ending h2 {
            margin: 22px 0;
            font-family: Georgia, serif;
            font-size: clamp(29px, 7vw, 44px);
            font-weight: normal;
            line-height: 1.4;
            text-shadow: 0 0 25px rgba(255,184,231,.6);
        }

        .ending p {
            color: #f3dff9;
            line-height: 1.8;
        }

        .sparkle {
            position: absolute;
            color: #ffe5fa;
            pointer-events: none;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        .again-btn {
            margin-top: 22px;
            padding: 12px 22px;
            border: 1px solid rgba(255,255,255,.45);
            border-radius: 30px;
            color: white;
            background: rgba(255,255,255,.12);
            cursor: pointer;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(18px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) rotate(0); }
            15% { opacity: .7; }
            100% { opacity: 0; transform: translateY(-115vh) rotate(35deg); }
        }

        @keyframes twinkle {
            from { opacity: .25; transform: scale(.7); }
            to { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 360px) {
            .card { padding: 28px 16px; }
            .choice { padding: 12px 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <button class="music-btn" id="musicBtn" aria-label="Bật hoặc tắt nhạc">
        ♫ Nhạc: OFF
    </button>

    <main class="card" id="mainCard">
        <div class="heart">♡</div>

        <p class="subtitle">MỘT CÂU HỎI NHỎ DÀNH CHO CẬU</p>

        <h1>Cậu có yêu tớ không?</h1>

        <p class="description">
            Tớ có điều này muốn hỏi cậu từ lâu rồi...
        </p>

        <div class="buttons" id="buttons">
            <button class="choice" id="yesBtn">Có ❤️</button>
            <button class="choice" id="noBtn">Không 🥺</button>
        </div>

        <p class="footer">made with a little courage ♡</p>
    </main>

    <section class="ending" id="ending" aria-hidden="true">
        <div class="ending-content">
            <div class="ending-heart">💗</div>
            <h2>Tớ cũng thích cậu nhiều lắm ❤️</h2>
            <p>
                Có những điều thật khó nói thành lời,<br>
                nhưng hôm nay tớ muốn cậu biết điều đó.
            </p>
            <p>♡ Mong rằng chúng ta sẽ có thật nhiều kỷ niệm đẹp. ♡</p>
            <button class="again-btn" id="againBtn">Đọc lại từ đầu ↺</button>
        </div>
    </section>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const buttons = document.getElementById("buttons");
        const ending = document.getElementById("ending");
        const mainCard = document.getElementById("mainCard");
        const musicBtn = document.getElementById("musicBtn");
        const againBtn = document.getElementById("againBtn");

        let noCount = 0;
        let musicOn = false;
        let audioContext = null;
        let musicTimer = null;
        let noteIndex = 0;

        // Nhạc piano tổng hợp bằng Web Audio API, không cần tải file.
        const melody = [
            [261.63, 329.63, 392.00],
            [220.00, 261.63, 329.63],
            [174.61, 220.00, 261.63],
            [196.00, 246.94, 293.66],
            [261.63, 329.63, 392.00],
            [196.00, 246.94, 329.63],
            [174.61, 220.00, 293.66],
            [196.00, 246.94, 392.00]
        ];

        function playNote(frequency, duration, volume = 0.045) {
            if (!audioContext || !musicOn) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.001, audioContext.currentTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playMusicStep() {
            if (!musicOn) return;

            const chord = melody[noteIndex % melody.length];
            chord.forEach((frequency, i) => {
                setTimeout(() => {
                    if (musicOn) playNote(frequency, 2.2, i === 0 ? 0.035 : 0.022);
                }, i * 35);
            });

            playNote(chord[0] * 2, 1.3, 0.018);
            noteIndex++;
        }

        async function toggleMusic() {
            if (!audioContext) {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (!AudioContextClass) {
                    alert("Trình duyệt này chưa hỗ trợ phát nhạc.");
                    return;
                }

                audioContext = new AudioContextClass();
            }

            if (musicOn) {
                musicOn = false;
                clearInterval(musicTimer);
                musicBtn.textContent = "♫ Nhạc: OFF";
            } else {
                await audioContext.resume();
                musicOn = true;
                musicBtn.textContent = "♫ Nhạc: ON";
                playMusicStep();
                musicTimer = setInterval(playMusicStep, 1800);
            }
        }

        musicBtn.addEventListener("click", toggleMusic);

        function createHeart() {
            if (ending.classList.contains("show")) return;

            const heart = document.createElement("span");
            heart.className = "float-heart";
            heart.textContent = ["♡", "♥", "✧"][Math.floor(Math.random() * 3)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (14 + Math.random() * 20) + "px";
            heart.style.color = ["#c5a4ff", "#f5a8d7", "#ffffff"][
                Math.floor(Math.random() * 3)
            ];
            heart.style.animationDuration = (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }

        setInterval(createHeart, 650);

        function handleNo() {
            noCount++;

            const yesScale = Math.min(1 + noCount * 0.20, 3.2);
            const noScale = Math.max(1 - noCount * 0.13, 0.35);

            yesBtn.style.transform = `scale(${yesScale})`;
            noBtn.style.transform = `scale(${noScale})`;

            // Sau vài lần bấm, nút Không chạy sang vị trí khác.
            if (noCount >= 2 && noCount < 7) {
                const maxX = Math.max(0, Math.min(100, window.innerWidth * 0.18));
                const maxY = 45;

                noBtn.style.position = "relative";
                noBtn.style.left = (Math.random() * 2 - 1) * maxX + "px";
                noBtn.style.top = (Math.random() * 2 - 1) * maxY + "px";
            }

            if (noCount >= 7) {
                noBtn.textContent = "Thử lại nhé? 🥺";
                noBtn.style.transform = "scale(0.35)";
            }
        }

        noBtn.addEventListener("click", handleNo);

        // Trên máy tính, nút Không cũng né con trỏ sau vài lần.
        noBtn.addEventListener("pointerenter", () => {
            if (noCount >= 3 && noCount < 7 && window.innerWidth > 600) {
                noBtn.style.left = (Math.random() * 100 - 50) + "px";
            }
        });

        function showEnding() {
            ending.classList.add("show");
            ending.setAttribute("aria-hidden", "false");

            for (let i = 0; i < 28; i++) {
                const sparkle = document.createElement("span");
                sparkle.className = "sparkle";
                sparkle.textContent = Math.random() > 0.5 ? "✦" : "✧";
                sparkle.style.left = Math.random() * 100 + "%";
                sparkle.style.top = Math.random() * 100 + "%";
                sparkle.style.fontSize = (12 + Math.random() * 22) + "px";
                sparkle.style.animationDelay = Math.random() * 2 + "s";
                ending.appendChild(sparkle);
            }

            // Nếu nhạc chưa bật, người dùng có thể bật bằng nút phía trên.
        }

        yesBtn.addEventListener("click", showEnding);

        againBtn.addEventListener("click", () => {
            ending.classList.remove("show");
            ending.setAttribute("aria-hidden", "true");
            ending.querySelectorAll(".sparkle").forEach(el => el.remove());

            noCount = 0;
            yesBtn.style.transform = "";
            noBtn.style.transform = "";
            noBtn.style.position = "";
            noBtn.style.left = "";
            noBtn.style.top = "";
            noBtn.textContent = "Không 🥺";
        });
    </script>
</body>
</html>
